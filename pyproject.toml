[project]
name = "onyx-pipeline"
version = "0.1.0"
description = "Onyx task pipeline CLI (onyx-job)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
onyx-job = "onyx_pipeline.cli:main"
onyx-think = "onyx_pipeline.think:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onyx_pipeline"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
